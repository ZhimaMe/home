<script>
// 1. 设置壁纸（浏览器会自动处理302重定向）
const style = document.createElement('style');
style.textContent = `
    body, html {
        background-image: url('https://wp.upx8.com/api.php?content=风景') !important;
        background-size: cover !important;
        background-position: center !important;
        background-repeat: no-repeat !important;
        background-attachment: fixed !important;
    }
    #panel, .panel-cover {
        background: transparent !important;
    }
`;
document.head.appendChild(style);

// 2. 页脚和箭头控制
document.addEventListener('DOMContentLoaded', function() {
    const footer = document.getElementById('siteFooter');
    const arrow = document.getElementById('scrollDownArrow');
    let isFooterVisible = false;
    let scrollTimeout = null;
    let lastScrollTop = 0;
    
    // 箭头点击事件
    arrow.addEventListener('click', function() {
        window.scrollTo({
            top: document.documentElement.scrollHeight,
            behavior: 'smooth'
        });
    });
    
    // 滚动检测逻辑
    window.addEventListener('scroll', function() {
        clearTimeout(scrollTimeout);
        const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
        const windowHeight = window.innerHeight;
        const documentHeight = document.documentElement.scrollHeight;
        const isScrollingDown = scrollTop > lastScrollTop;
        lastScrollTop = scrollTop;
        const isAtBottom = scrollTop + windowHeight >= documentHeight - 100;
        
        if (isAtBottom || isFooterVisible) {
            arrow.classList.add('hidden');
        } else if (scrollTop > 50) {
            if (!isScrollingDown) {
                arrow.classList.remove('hidden');
            }
        } else {
            arrow.classList.remove('hidden');
        }
        
        if (isAtBottom && !isFooterVisible) {
            footer.classList.add('visible');
            isFooterVisible = true;
        } else if (!isAtBottom && isFooterVisible) {
            footer.classList.remove('visible');
            isFooterVisible = false;
        }
        
        scrollTimeout = setTimeout(function() {
            if (!isAtBottom && isFooterVisible) {
                footer.classList.remove('visible');
                isFooterVisible = false;
            }
        }, 1000);
    });
    
    function checkInitialPosition() {
        const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
        const windowHeight = window.innerHeight;
        const documentHeight = document.documentElement.scrollHeight;
        const isAtBottom = scrollTop + windowHeight >= documentHeight - 100;
        
        if (isAtBottom) {
            footer.classList.add('visible');
            isFooterVisible = true;
            arrow.classList.add('hidden');
        }
    }
    
    setTimeout(checkInitialPosition, 100);
});
</script>
